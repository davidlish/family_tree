<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>族谱树</title>
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#3a332b; --muted:#8d8a86;
  --line:#d8cbb8; --accent:#8a5a2b; --male:#3f6fb5; --female:#c05a7a; --unknown:#9a938a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(160deg,#f7f2eb 0%,#efe6d8 100%);
  color:var(--ink);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  min-height:100vh;
}
header{
  position:sticky; top:0; z-index:50;
  background:rgba(255,253,249,.95); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:12px 16px;
  display:block; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:block; align-items:center; gap:12px; flex-wrap:wrap;}
header h1{font-size:21px; margin:0; letter-spacing:2px; color:var(--accent); font-weight:700; white-space:nowrap;}
header .sub{font-size:12px; color:var(--muted);}
.search{display:block; flex-direction:column; gap:8px; margin-left:auto; align-items:flex-end; min-width:0; clear: both;}
.search-row{display:flex; gap:8px; align-items:center;}
.search input{width:140px; padding:7px 12px; font-size:15px; border:1px solid var(--line); border-radius:22px; outline:none; background:#fff; color:var(--ink);}
.search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(138,90,43,.12);}
.btn{padding:5px 13px; font-size:14px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:#fff; color:var(--ink); white-space:nowrap;}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.primary:hover{background:#71491f; color:#fff;}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; float:right; margin: 6px 0;}
.mode-switch{display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden;}
.btn.seg{border:none; border-radius:0; padding:8px 14px; background:#fff; color:var(--muted);}
.btn.seg.active{background:var(--accent); color:#fff;}
#status{font-size:12px; color:var(--muted); max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#results{display:none; flex-direction:row; gap:6px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:thin; background-color: #bfd7f5;}
#results.show{display:flex;}
#results .none{padding:10px 12px; color:var(--muted); font-size:14px; letter-spacing:1px; white-space:nowrap;}
#results .hint{padding:10px 12px; color:var(--muted); font-size:12px; white-space:nowrap;}
.result-item{flex:0 0 auto; display:flex; flex-direction:column; min-width:fit-content; text-align:left; background:#fff; border:1px solid transparent; border-radius:8px; padding:8px 12px; cursor:pointer; transition:.15s;}
.result-item:hover{border-color:var(--accent); background:#fbf4e8;}
.result-item .r-name{font-size:15px; font-weight:600; color:var(--ink); white-space:nowrap;}
.result-item .r-sub{font-size:12px; color: #5a5147; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px;}
main{padding:24px 18px 80px; overflow-x:auto;}
.node{margin:0;}
.card{display:flex; gap:14px; align-items:flex-start; background:var(--card); border-radius:12px; padding:12px 16px; box-shadow:0 2px 10px rgba(70,50,25,.08); cursor:pointer; border:1px solid #efe5d6; border-left-width:5px; transition:.15s; width:460px; margin:6px 0;}
.card:hover{box-shadow:0 6px 18px rgba(70,50,25,.14); transform:translateY(-1px);}
.card.male{border-left-color:var(--male);}
.card.female{border-left-color:var(--female);}
.card.unknown{border-left-color:var(--unknown);}
.card.highlight{outline:3px solid rgba(138,90,43,.45); outline-offset:2px;}
.photo-box{flex:0 0 auto; width:100px; height:120px; border-radius:10%; overflow:hidden; background:#f0e8db; border:2px dashed #cdbda5; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#b5a78f; font-size:11px; text-align:center; line-height:1.3;}
.photo-box .photo.empty{padding:6px;}
.photo-box .photo.has{width:100%; height:100%; object-fit:cover; display:block;}
.info{flex:1; min-width:0;}
.topline{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.name{font-size:19px; font-weight:700; color:var(--ink);}
.sex{font-size:12px; color:#fff; border-radius:10px; padding:2px 8px;}
.male .sex{background:var(--male);}
.female .sex{background:var(--female);}
.unknown .sex{background:var(--unknown);}
.gen{font-size:12px; color:var(--accent); border:1px solid var(--accent); border-radius:10px; padding:2px 8px;}
.arrow{font-size:12px; color:var(--muted); margin-left:auto;}
.row{margin-top:6px; font-size:14px; color:#5a5147; line-height:1.5;}
.row .k{display:inline-block; min-width:52px; color:var(--muted); font-size:12px; letter-spacing:1px;}
.row.detail{color:#756a5d; font-size:13px;}
.children{margin-left:26px; padding-left:16px; border-left:2px solid var(--line);}
.edit-btns{display:none; margin-top:8px; gap:6px; flex-wrap:wrap;}
body.editing .edit-btns{display:flex;}
.eb{padding:5px 11px; font-size:12px; border:1px solid var(--line); border-radius:14px; background:#fff; color:var(--accent); cursor:pointer;}
.eb.danger{color:#c0392b; border-color:#e4b9b3;}
/* 简约型：只显示姓名，突出树形结构，节点按姓名宽度自动收窄 */
body.compact .card{display:inline-flex; width:auto; padding:6px 12px; gap:8px;}
body.compact .info{flex:none;}
body.compact .photo-box,
body.compact .row,
body.compact .sex,
body.compact .gen{display:none;}
body.compact .name{font-size:15px; white-space:nowrap;}
.modal-overlay{position:fixed; inset:0; background:rgba(40,30,20,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal-box{background:#fffdf9; border-radius:14px; width:100%; max-width:520px; max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fffdf9;}
.modal-head span{font-size:17px; font-weight:700; color:var(--accent);}
.modal-head .close{border:none; background:none; font-size:26px; cursor:pointer; color:var(--muted); line-height:1;}
.modal-body{padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
.modal-body label{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted);}
.modal-body input,.modal-body select,.modal-body textarea{font-size:15px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font-family:inherit;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:12px 18px 16px;}
#toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:rgba(50,40,30,.92); color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; max-width:86vw; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s;}
#toast.show{opacity:1;}
#search-count{font-size:12px; margin-left:2em; color:var(--muted);}
.ten-ancestors{font-size:10px; margin-top:4px; color: rgb(39, 141, 209); text-align:center}
@media (max-width:640px){
  header{flex-direction:column; align-items:stretch;}
  .search{margin-left:0; align-items:stretch;}
  #results{width:100%; max-width:100%;}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="basic-info">
      <h1>中江李氏族谱</h1>
      <div class="ten-ancestors">始祖铜公▷文标▷发琳▷再雄▷彦贵▷斌公▷子镮▷仕冕▷希荣▷弘信▷应和</div>
    </div>
    <div class="toolbar">
      <div class="mode-switch">
        <label><input type="radio" id="modeDetail" name="showModel">详尽型</label>
        <label><input type="radio" id="modeCompact" name="showModel">简约型</label>
      </div>
      <button id="btnEdit" type="button">编辑</button>
    </div>
  </div>
  <div class="search">
    <div class="search-row">
      <input id="q" type="text" placeholder="输入姓名查询">
      <button id="searchBtn" class="btn primary" type="button">查询</button>
      <label id="search-count"></label>
    </div>
    <div id="results"></div>
  </div>
  <span id="status">正在加载…</span>
</header>
<main id="tree"></main>

<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle">编辑</span><button type="button" class="close" id="modalClose">&times;</button></div>
    <div class="modal-body">
      <label>姓名（必填）<input id="f_name" type="text"></label>
      <label>性别
        <select id="f_sex"><option value="男">男</option><option value="女">女</option><option value="">未知</option></select>
      </label>
      <label>配偶 / 配氏<input id="f_spouse" type="text" placeholder="如：姜氏；多个配偶用、分隔"></label>
      <label>出生日期<input id="f_birth_date" type="text" placeholder="如 1942年11月27日"></label>
      <label>出生地<input id="f_birth_place" type="text"></label>
      <label>居住地<input id="f_living_place" type="text"></label>
      <label>去世日期<input id="f_death_date" type="text"></label>
      <label>简介<textarea id="f_detail" rows="3"></textarea></label>
    </div>
    <div class="modal-foot"><button type="button" id="modalSave" class="btn primary">保存</button><button type="button" id="modalCancel" class="btn">取消</button></div>
  </div>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
(function(){
  'use strict';
  var cfg = window.APP_CONFIG || {};
  var SUPABASE_URL = (cfg.supabaseUrl || '').replace(/\/+$/,'');
  var ANON_KEY = cfg.supabaseAnonKey || '';
  var BUCKET = cfg.bucket || 'photos';
  var TREE_ID = cfg.treeId || 'main';
  function hasBackend(){ return !!(SUPABASE_URL && ANON_KEY); }

  var rootData = null;
  var rev = 0;
  var nodeMap = new Map();
  var flat = [];
  var editingEnabled = false;
  var detailMode = true;
  var editGranted = false;
  var SEP = String.fromCharCode(1);
  var modalKey = null, modalParentKey = null;

  var rootEl = document.getElementById('tree');
  var statusEl = document.getElementById('status');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function setStatus(t){ statusEl.textContent = t; }
  function toast(t){
    toastEl.textContent = t;
    toastEl.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function apiFetch(method, path, body, headers){
    var url = SUPABASE_URL + path;
    var h = { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY };
    if(headers){ for(var k in headers) h[k] = headers[k]; }
    var opt = { method: method, headers: h };
    if(body !== undefined && body !== null) opt.body = body;
    return fetch(url, opt).then(function(res){
      if(!res.ok){
        return res.text().then(function(t){ throw new Error('HTTP '+res.status+' '+t.slice(0,160)); });
      }
      var ct = res.headers.get('content-type') || '';
      if(ct.indexOf('application/json') >= 0) return res.json();
      return res.text();
    });
  }

  function loadLocalData(){
    return fetch('data.json').then(function(r){ return r.json(); });
  }

  function load(){
    setStatus('加载中…');
    var p;
    if(!hasBackend()){
      p = loadLocalData().then(function(d){ rootData=d; rev=0; setStatus('只读模式：未配置云端数据库'); });
    } else {
      p = apiFetch('GET', '/rest/v1/family_trees?id=eq.'+encodeURIComponent(TREE_ID)+'&select=*')
        .then(function(rows){
          if(rows && rows.length){
            rootData = rows[0].data; rev = rows[0].rev || 0; setStatus('已连接云端');
          } else {
            return loadLocalData().then(function(d){
              rootData = d;
              return apiFetch('POST', '/rest/v1/family_trees',
                JSON.stringify({ id: TREE_ID, data: d, rev: 0 }),
                { 'Content-Type':'application/json', 'Prefer':'return=representation' }
              ).then(function(){ rev=0; setStatus('首次使用：已自动上传族谱数据'); });
            });
          }
        });
    }
    p.then(function(){ render(); })
     .catch(function(e){
       setStatus('云端连接失败：'+e.message);
       return loadLocalData().then(function(d){ rootData=d; render(); setStatus('云端连接失败，已显示本地数据（只读）'); })
         .catch(function(){ setStatus('加载失败：'+e.message); });
     });
  }

  function render(){
    rootEl.innerHTML = '';
    nodeMap.clear(); flat.length = 0;
    if(rootData) rootEl.appendChild(renderNode(rootData, [rootData.name], 10, null));
  }

  function renderNode(data, path, depth, parentArr){
    var key = path.join(SEP);
    var hasChildren = data.children && data.children.length > 0;
    var gen = depth + 1;
    var sexClass = data.sex==='女' ? 'female' : (data.sex==='男' ? 'male' : 'unknown');
    var photo = data.photo || '';
    var photoHtml = photo
      ? '<img class="photo has" src="'+esc(photo)+'" alt="照片">'
      : '<div class="photo empty">'+(editingEnabled ? '上传<br>照片' : '无照片')+'</div>';
    var rows = [];
    if(data.spouse) rows.push('<div class="row"><span class="k">配偶</span>'+esc(data.spouse)+'</div>');
    if(data.birth_date) rows.push('<div class="row"><span class="k">出生</span>'+esc(data.birth_date)+'</div>');
    if(data.birth_place) rows.push('<div class="row"><span class="k">出生地</span>'+esc(data.birth_place)+'</div>');
    if(data.living_place) rows.push('<div class="row"><span class="k">居住地</span>'+esc(data.living_place)+'</div>');
    if(data.death_date) rows.push('<div class="row"><span class="k">去世</span>'+esc(data.death_date)+'</div>');
    if(data.detail) rows.push('<div class="row detail">'+esc(data.detail)+'</div>');

    var wrap = document.createElement('div'); wrap.className = 'node';
    var card = document.createElement('div'); card.className = 'card ' + sexClass;
    card.innerHTML =
      '<div class="photo-box" title="点击上传照片">'+photoHtml+'</div>' +
      '<div class="info">' +
        '<div class="topline"><span class="name">'+esc(data.name)+'</span>' +
        '<span class="sex">'+(data.sex||'')+'</span>' +
        '<span class="gen">第'+gen+'代</span>' +
        (hasChildren ? '<span class="arrow">▶</span>' : '') +
        '</div>' +
        rows.join('') +
        '<div class="edit-btns">' +
          '<button type="button" class="eb" data-act="edit">编辑</button>' +
          '<button type="button" class="eb" data-act="add">添加子女</button>' +
          (parentArr ? '<button type="button" class="eb danger" data-act="del">删除</button>' : '') +
        '</div>' +
      '</div>';

    var childrenEl = document.createElement('div');
    childrenEl.className = 'children';
    childrenEl.style.display = 'none';
    if(hasChildren){
      data.children.forEach(function(ch){ childrenEl.appendChild(renderNode(ch, path.concat([ch.name]), depth+1, data.children)); });
    }
    wrap.appendChild(card); wrap.appendChild(childrenEl);

    var rec = { el:wrap, card:card, childrenEl:childrenEl, data:data, path:path.slice(), key:key, expanded:false, parentArr:parentArr || null };
    nodeMap.set(key, rec);
    flat.push({ name:data.name, key:key, path:path.slice(), depth:depth });

    card.addEventListener('click', function(e){
      if(e.target.closest('.photo-box')) return;
      if(e.target.closest('.edit-btns')) return;
      toggle(key);
    });
    card.querySelector('.edit-btns').addEventListener('click', function(e){
      e.stopPropagation();
      var b = e.target.closest('.eb'); if(!b) return;
      var act = b.getAttribute('data-act');
      if(act==='edit') editNode(key);
      else if(act==='add') addChild(key);
      else if(act==='del') deleteNode(key);
    });
    card.querySelector('.photo-box').addEventListener('click', function(e){
      e.stopPropagation();
      photoClick(key, this);
    });
    return wrap;
  }

  function toggle(key){
    var rec = nodeMap.get(key); if(!rec) return;
    if(!rec.data.children || !rec.data.children.length) return;
    rec.expanded = !rec.expanded;
    rec.childrenEl.style.display = rec.expanded ? '' : 'none';
    var a = rec.card.querySelector('.arrow');
    if(a) a.textContent = rec.expanded ? '▼' : '▶';
  }

  function rerender(extraExpandKeys){
    var was = new Set();
    nodeMap.forEach(function(rec, k){ if(rec.expanded) was.add(k); });
    if(extraExpandKeys) extraExpandKeys.forEach(function(k){ was.add(k); });
    render();
    was.forEach(function(k){
      var rec = nodeMap.get(k);
      if(rec && rec.data.children && rec.data.children.length){
        rec.expanded = true; rec.childrenEl.style.display = '';
        var a = rec.card.querySelector('.arrow'); if(a) a.textContent = '▼';
      }
    });
  }

  function expandTo(path){
    for(var i=0; i<path.length-1; i++){
      var key = path.slice(0, i+1).join(SEP);
      var rec = nodeMap.get(key);
      if(rec && rec.data.children && rec.data.children.length){
        rec.expanded = true; rec.childrenEl.style.display = '';
        var a = rec.card.querySelector('.arrow'); if(a) a.textContent = '▼';
      }
    }
    var target = nodeMap.get(path.join(SEP));
    if(target){
      target.el.scrollIntoView({behavior:'smooth', block:'center'});
      target.card.classList.add('highlight');
      setTimeout(function(){ target.card.classList.remove('highlight'); }, 2200);
    }
  }

  // ---- 搜索：结果显示在查询面板最后一行，可左右滑动，只显示上 3 代 ----
  var qInput = document.getElementById('q');
  var resultsEl = document.getElementById('results');
  function doSearch(){
    var q = qInput.value.trim();
    resultsEl.innerHTML = '';
    if(!q){ resultsEl.classList.remove('show'); return; }
    var matches = flat.filter(function(n){ return n.name === q || n.name.indexOf(q) >= 0; });
    if(matches.length === 0){
      resultsEl.classList.add('show');
      resultsEl.innerHTML = '<div class="none">查无此人</div>';
      return;
    }
    document.getElementById('search-count').textContent = '共 '+matches.length+' 个结果';
    resultsEl.classList.add('show');
    matches.forEach(function(m){
      var item = document.createElement('button');
      item.type = 'button'; item.className = 'result-item';
      // 上辈 3 代：父、祖父、曾祖父（不足则显示已有的）
      var anc = m.path.slice(0, -1).slice(-3);
      var sub = anc.length ? anc.join(' › ') : '根';
      // item.innerHTML = '<span class="r-name">'+esc(m.name)+'</span><span class="r-sub">'+esc(sub)+'</span>';
      item.innerHTML = '</span><span class="r-sub">'+esc(sub)+'</span>';
      item.addEventListener('click', function(){ expandTo(m.path); });
      resultsEl.appendChild(item);
    });
  }
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  qInput.addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(); });

  // ---- 详尽型 / 简约型 切换 ----
  function setMode(detail){
    if(detailMode === detail) return;
    detailMode = detail;
    document.body.classList.toggle('compact', !detail);
    document.getElementById('modeDetail').classList.toggle('active', detail);
    document.getElementById('modeCompact').classList.toggle('active', !detail);
    rerender();
  }
  document.getElementById('modeDetail').addEventListener('click', function(){ setMode(true); });
  document.getElementById('modeCompact').addEventListener('click', function(){ setMode(false); });

  // ---- 编辑模式 ----
  function setEditBtnText(){
    document.getElementById('btnEdit').textContent = editingEnabled ? '完成' : '编辑';
  }
  function toggleEditing(){
    if(editingEnabled){ editingEnabled=false; document.body.classList.remove('editing'); setEditBtnText(); toast('已退出编辑模式'); return; }
    if(cfg.editPassword && !editGranted){
      var p = prompt('请输入编辑密码');
      if(p === null) return;
      if(p !== cfg.editPassword){ toast('密码错误'); return; }
      editGranted = true;
    }
    if(!hasBackend()){ toast('未配置云端数据库，只能只读浏览'); return; }
    editingEnabled = true;
    document.body.classList.add('editing');
    setEditBtnText();
    toast('已开启编辑模式：点卡片上的“编辑/添加子女/删除”操作');
  }

  function openModal(data, title){
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('f_name').value = data.name || '';
    document.getElementById('f_sex').value = data.sex || '';
    document.getElementById('f_spouse').value = data.spouse || '';
    document.getElementById('f_birth_date').value = data.birth_date || '';
    document.getElementById('f_birth_place').value = data.birth_place || '';
    document.getElementById('f_living_place').value = data.living_place || '';
    document.getElementById('f_death_date').value = data.death_date || '';
    document.getElementById('f_detail').value = data.detail || '';
    document.getElementById('modal').style.display = 'flex';
  }
  function closeModal(){ document.getElementById('modal').style.display = 'none'; }

  function applyForm(o){
    o.name = document.getElementById('f_name').value.trim();
    o.sex = document.getElementById('f_sex').value;
    o.spouse = document.getElementById('f_spouse').value.trim();
    o.birth_date = document.getElementById('f_birth_date').value.trim();
    o.birth_place = document.getElementById('f_birth_place').value.trim();
    o.living_place = document.getElementById('f_living_place').value.trim();
    o.death_date = document.getElementById('f_death_date').value.trim();
    o.detail = document.getElementById('f_detail').value.trim();
  }

  function editNode(key){
    var rec = nodeMap.get(key); if(!rec) return;
    modalKey = key; modalParentKey = null;
    openModal(rec.data, '编辑：'+rec.data.name);
  }
  function addChild(key){
    var rec = nodeMap.get(key); if(!rec) return;
    modalKey = null; modalParentKey = key;
    openModal({name:'',sex:'男',spouse:'',birth_date:'',birth_place:'',living_place:'',death_date:'',detail:''}, '添加子女：'+rec.data.name);
  }

  function saveForm(){
    var name = document.getElementById('f_name').value.trim();
    if(!name){ toast('请填写姓名'); return; }
    var expand = [];
    if(modalKey){
      var rec = nodeMap.get(modalKey);
      if(rec){ applyForm(rec.data); for(var i=0;i<rec.path.length-1;i++) expand.push(rec.path.slice(0,i+1).join(SEP)); }
    } else if(modalParentKey){
      var parent = nodeMap.get(modalParentKey);
      var child = { children: [] };
      applyForm(child);
      if(!parent.data.children) parent.data.children = [];
      parent.data.children.push(child);
      expand.push(modalParentKey);
    }
    closeModal();
    persist().then(function(ok){ if(ok) rerender(expand); });
  }

  function deleteNode(key){
    var rec = nodeMap.get(key);
    if(!rec || !rec.parentArr){ toast('根节点不可删除'); return; }
    if(!confirm('确定删除「'+rec.data.name+'」及其全部后代吗？此操作不可撤销。')) return;
    var idx = rec.parentArr.indexOf(rec.data);
    if(idx >= 0) rec.parentArr.splice(idx, 1);
    var parentKey = rec.path.slice(0,-1).join(SEP);
    persist().then(function(ok){ if(ok) rerender([parentKey]); });
  }

  function persist(){
    if(!hasBackend()){ toast('只读模式，无法保存'); return Promise.resolve(false); }
    setStatus('保存中…');
    var newRev = (rev||0) + 1;
    return apiFetch('PATCH', '/rest/v1/family_trees?id=eq.'+encodeURIComponent(TREE_ID)+'&rev=eq.'+(rev||0),
      JSON.stringify({ data: rootData, rev: newRev }),
      { 'Content-Type':'application/json', 'Prefer':'return=representation' }
    ).then(function(rows){
      if(!rows || !rows.length){ toast('保存冲突：别人刚修改过，请刷新后重试'); setStatus('保存冲突'); return false; }
      rev = newRev;
      setStatus('已保存 '+new Date().toLocaleTimeString('zh-CN', {hour12:false}));
      return true;
    }).catch(function(e){
      setStatus('保存失败：'+e.message);
      toast('保存失败，请检查网络后重试');
      return false;
    });
  }

  // ---- 照片 ----
  function photoClick(key, box){
    var rec = nodeMap.get(key); if(!rec) return;
    if(editingEnabled && hasBackend()){ uploadPhoto(key, box); }
    else if(rec.data.photo){ window.open(rec.data.photo, '_blank'); }
    else if(!hasBackend()){ toast('未配置云端，无法上传照片'); }
    else { toast('请先点“编辑”开启编辑模式，再点照片上传'); }
  }

  function uploadPhoto(key, box){
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = function(){
      var f = input.files && input.files[0]; if(!f) return;
      resizeImage(f, 720).then(function(blob){
        var filename = 'p_'+Date.now()+'_'+Math.floor(Math.random()*100000)+'.jpg';
        return apiFetch('POST', '/storage/v1/object/'+encodeURIComponent(BUCKET)+'/'+filename, blob,
          { 'Content-Type':'image/jpeg', 'x-upsert':'false' }
        ).then(function(){
          var url = SUPABASE_URL + '/storage/v1/object/public/'+encodeURIComponent(BUCKET)+'/'+filename;
          var rec = nodeMap.get(key); if(rec) rec.data.photo = url;
          return persist().then(function(ok){ if(ok){ box.innerHTML = '<img class="photo has" src="'+esc(url)+'" alt="照片">'; } });
        });
      }).catch(function(e){ toast('照片上传失败：'+e.message); });
    };
    input.click();
  }

  function resizeImage(file, max){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.width, h = img.height;
        var sc = Math.min(1, max/Math.max(w,h));
        w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cv.toBlob(function(b){ if(b) resolve(b); else reject(new Error('图片处理失败')); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('无法读取图片')); };
      img.src = url;
    });
  }

  // ---- 绑定按钮 ----
  document.getElementById('btnEdit').addEventListener('click', toggleEditing);
  document.getElementById('modalSave').addEventListener('click', saveForm);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

  setEditBtnText();
  load();
})();
</script>
</body>
</html>
